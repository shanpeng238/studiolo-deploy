# Studiolo 智学 — Mac 本地开发用基础设施（**不是交付文件**）
#
# 只启动运行环境（向量模型 / 图库 / 向量库 / 关系库 / 缓存 / 对象存储），
# 前后端在 Mac 上源码直跑（backend `python main.py` :8001，frontend `npm run dev` :3001）。
# 正式交付用 docker-compose.yml（CPU）或 docker-compose-gpu.yml（GPU），都在 Linux 上。
#
# 本机同时跑着 verimind-deploy 时，**只起 neo4j** 即可，其余服务复用 verimind 的容器：
#   docker compose -f docker-compose-mac.yml up -d neo4j
# 全量启动会占用 5432 / 6379 / 19530 / 5000，与 verimind 栈冲突。
#
# 首次从旧的单容器配置切过来时，现有 studiolo-neo4j 容器不属于本 compose 项目，
# 会报容器名冲突，先执行 `docker rm -f studiolo-neo4j` 再起（数据在 ./data/neo4j，不受影响）。
#
# 端口与 backend/.env.example 的默认值对齐：Neo4j 用 7475/7688 错开 verimind 的 7474/7687。

name: studiolo-mac

networks:
  studiolo-net:
    driver: bridge

services:
  # 向量模型服务（CPU 推理；macOS 无 NVIDIA，GPU 版只在 Linux 用）
  model-service:
    # 沿用已发布的 verimind 仓库名（v1.0.0 是多架构标签，arm64 直接可用）
    image: shanpeng238/verimind-bge-m3-service:v1.0.0
    container_name: studiolo-bge-m3-service
    restart: always
    ports:
      - "5000:5000"
    networks:
      - studiolo-net

  # 知识图谱（arm64 镜像）
  neo4j:
    # 镜像沿用 verimind 仓库名；该仓只有按架构分开的 tag，arm64 用 -arm64
    image: shanpeng238/verimind-neo4j:5.26-arm64
    container_name: studiolo-neo4j
    restart: always
    ports:
      - "7475:7474"   # HTTP 控制台（错开 verimind 的 7474）
      - "7688:7687"   # Bolt 连接（错开 verimind 的 7687）
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # 插件（GDS + APOC）已预装进镜像，勿设 NEO4J_PLUGINS（会触发重复下载）
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      start_period: 60s
      timeout: 20s
      retries: 3
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - studiolo-net

  # 向量数据库
  milvus:
    image: milvusdb/milvus:v2.6.9
    container_name: studiolo-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    restart: always
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    volumes:
      - ./data/milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - studiolo-net

  # 关系库：全新数据目录时自动执行 init.sql 建表
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studiolo-postgres
    restart: always
    command: -c timezone=Asia/Shanghai
    env_file: .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      start_period: 20s
      timeout: 10s
      retries: 6
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - studiolo-net

  redis:
    image: redis:8.2.3
    container_name: studiolo-redis
    restart: always
    env_file: .env
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ./data/redis:/data
    networks:
      - studiolo-net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: studiolo-minio
    restart: always
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    env_file: .env
    volumes:
      - ./data/minio:/data
    networks:
      - studiolo-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: studiolo-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - studiolo-net
