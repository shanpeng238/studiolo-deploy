# Studiolo 智学 — 企业版私有化部署（独立完整栈）
#
# 与其它产品的部署栈完全独立：自建网络 studiolo-net、自有容器名与数据目录，
# 不与其它产品共享容器、网络或镜像命名空间。
#
# 使用：cp env.example .env && vim .env && docker compose up -d
# 说明：本文件不需要修改，连接串与内部地址由下面的 environment 段自动组装。

name: studiolo

networks:
  studiolo-net:
    driver: bridge

services:
  # =========================================
  # 1. 后端 (Backend)
  # =========================================
  backend:
    image: shanpeng238/studiolo-backend:v1.0.0
    container_name: studiolo-backend
    restart: always
    # 宿主机 8001 → 容器 8000（容器内固定 8000，与镜像 CMD 一致）
    ports:
      - "8001:8000"
    volumes:
      - ./logs:/app/logs
      # JWT 签名密钥对：覆盖镜像内的开发用密钥（部署包自带一份独立密钥）
      - ./secrets/jwt-private.pem:/app/jwt-private.pem:ro
      - ./secrets/jwt-public.pem:/app/jwt-public.pem:ro
      # 授权文件挂载：在线激活写入 /app/studiolo.lic，不挂载则容器重建后授权丢失。
      # ⚠️ 宿主机文件必须预先存在（secrets/studiolo.lic 已预置空文件）——
      # Docker 对不存在的挂载源会创建成目录，导致后端写入时报 IsADirectoryError。
      - ./secrets/studiolo.lic:/app/studiolo.lic
      # 挂载宿主机根目录：硬件指纹取的是宿主机的 machine-id / product_uuid
      - /:/host_sys:ro
      - ./data/uploads:/app/uploads
    env_file: .env
    environment:
      # 连接串在这里组装，.env 里只填密码与库名（不要自己拼 URL）
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MILVUS_URI=http://milvus:19530
      - MODEL_SERVICE_URL=http://model-service:5000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      # 后端对外地址：附件/图片 URL 由它拼出，必须与浏览器实际访问的地址一致
      - BASE_URL=${BACKEND_PUBLIC_URL:-http://localhost:8001}
      # 健康探针从容器内访问 127.0.0.1:8000。客户把 ALLOWED_HOSTS 收紧成实际 IP/域名后，
      # 探针的 Host 头就成了非法主机被 TrustedHost 拦成 400——这里强制补上回环地址。
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*},127.0.0.1,localhost
    # 健康检查只探数据库与 Redis（见 backend/app/core/factory.py 的 /health）。
    # 镜像内没有 curl/wget，用 python 标准库。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)
      interval: 30s
      start_period: 120s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      model-service:
        condition: service_started
      # Neo4j 完全就绪（Bolt 监听）后再启动后端，避免图降级
      neo4j:
        condition: service_healthy
    networks:
      - studiolo-net

  # =========================================
  # 2. 前端 (Frontend)
  # =========================================
  frontend:
    image: shanpeng238/studiolo-frontend:v1.0.0
    container_name: studiolo-frontend
    restart: always
    # 宿主机 3001 → 容器 3000
    ports:
      - "3001:3000"
    environment:
      # /env.js 路由在运行时读取它写入浏览器；改地址不需要重建镜像
      - API_BASE_URL=${BACKEND_PUBLIC_URL:-http://localhost:8001}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - studiolo-net

  # =========================================
  # 3. 向量模型服务 (bge-m3，embedding)
  # =========================================
  model-service:
    # 镜像沿用已发布的基础镜像仓库名（v1.0.0 是多架构标签）；容器名仍是 studiolo 的
    image: shanpeng238/verimind-bge-m3-service:v1.0.0
    container_name: studiolo-bge-m3-service
    restart: always
    networks:
      - studiolo-net

  # =========================================
  # 4. 知识图谱 (Neo4j + GDS + APOC)
  # =========================================
  neo4j:
    # 同上：基础镜像仓库名沿用，内容为 Neo4j 5.26 + GDS + APOC
    image: shanpeng238/verimind-neo4j:5.26-amd64
    container_name: studiolo-neo4j
    restart: always
    ports:
      # 控制台只绑本机回环：需要看图谱时通过 SSH 隧道访问，不对公网开放。
      # Bolt(7687) 不对外发布，只供容器内后端使用。
      - "127.0.0.1:7474:7474"
    environment:
      # NEO4J_AUTH 必须与 .env 的 NEO4J_PASSWORD 一致
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # 插件（GDS + APOC）已预装进镜像，勿设 NEO4J_PLUGINS（会触发重复下载）
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      start_period: 60s
      timeout: 20s
      retries: 3
    volumes:
      # 插件已预装进镜像，不挂载 plugins 卷，避免覆盖镜像内插件
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - studiolo-net

  # =========================================
  # 5. 向量数据库 (Milvus standalone)
  # =========================================
  milvus:
    image: milvusdb/milvus:v2.6.9
    container_name: studiolo-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    restart: always
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    volumes:
      - ./data/milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - studiolo-net

  # =========================================
  # 6. 基础设施 (Postgres / Redis / MinIO / Etcd)
  # 全部不对外发布端口：只供容器间的服务名访问
  # =========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studiolo-postgres
    restart: always
    # 时区在启动参数里设，不写进 init.sql——写死库名的 ALTER DATABASE 会让
    # 客户改 POSTGRES_DB 后 initdb 报错中止，postgres 容器起不来。
    command: -c timezone=Asia/Shanghai
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      start_period: 20s
      timeout: 10s
      retries: 6
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # 全新库（数据目录为空）时自动建表；已有数据时不会重复执行
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - studiolo-net

  redis:
    image: redis:8.2.3
    container_name: studiolo-redis
    restart: always
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ./data/redis:/data
    networks:
      - studiolo-net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: studiolo-minio
    restart: always
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    env_file: .env
    volumes:
      - ./data/minio:/data
    networks:
      - studiolo-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: studiolo-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - studiolo-net
